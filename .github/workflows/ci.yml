name: CodeQuest CI
on:
  push:
    branches: [main, dev/codequest-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: codequest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      # Capture actual WebGL gameplay evidence even when unrelated full-suite tests fail.
      - run: CODEQUEST_WEBGL_TEST=1 npm run test:browser -- tests/tor-model.spec.mjs tests/lagos-3d.spec.mjs
      - run: npm run test:browser
      - run: npm run test:cloud
      - run: npm run test:community
      # Cloud browser tests rebuild dist with mocked provider settings.
      # Restore the real production bundle before finishing CI.
      - run: npm run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            test-results
            playwright-report
  native-export:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: node scripts/export-sample.mjs
      - run: dotnet build test-results/native-project/CodeQuestForms.sln -c Release
